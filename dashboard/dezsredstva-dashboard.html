<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Расход дезсредств — Усть-Каменогорская птицефабрика</title>
<style>
:root{
  --sand:#E5DCC2; --sand-deep:#D8CEB0; --surface:#F4EFE1; --surface-2:#FBF8EF;
  --teal:#00897B; --teal-deep:#046A60; --teal-soft:#D7E9E5;
  --brown:#4F2E1C; --ink:#2B1C12; --ink-2:#5C4A3C; --muted:#8B7B6B;
  --grid:#DED4BA; --rule:#CFC4A6;
  --s1:#00897B; --s2:#C4571F; --s3:#2A6FD6; --s4:#9A7B00;
  --s5:#B8437E; --s6:#2E7D32; --s7:#5B4BA8; --s8:#A33A2E;
  --radius:14px;
  --font:"Segoe UI",system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--sand);color:var(--ink);font:14px/1.5 var(--font);
     -webkit-font-smoothing:antialiased}
.app{display:grid;grid-template-columns:56px minmax(0,1fr);min-height:100vh}

/* ---- орнаментальная колонка, как на фирменном фоне ---- */
.rail{background:var(--sand);padding:14px 0;display:flex;flex-direction:column;
      align-items:center;gap:8px;border-right:1px solid var(--rule)}
.rail i{width:36px;height:36px;border-radius:8px;background:var(--teal);display:block;
        opacity:.92;transition:transform .5s cubic-bezier(.2,.9,.25,1),opacity .4s}
.rail i:nth-child(even){opacity:.8}
.rail:hover i{transform:translateY(-2px)}
.rail i svg{width:36px;height:36px;display:block}

.main{padding:22px 26px 60px;max-width:1500px;width:100%;min-width:0}
header.top{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-end;justify-content:space-between;
           padding-bottom:16px;border-bottom:2px solid var(--rule);margin-bottom:22px}
.brand{display:flex;align-items:center;gap:12px;min-width:0;flex:1 1 420px}
.brand img#logo{height:46px;width:auto;max-width:230px;object-fit:contain;flex:none}
.wordmark{font:600 25px/1 var(--font);color:var(--brown);letter-spacing:.5px;flex:none;
          padding-right:14px;border-right:2px solid var(--rule)}
.wordmark b{font-weight:700}
.brand h1{margin:0;font-size:19px;letter-spacing:.2px;color:var(--brown);font-weight:700;overflow-wrap:anywhere}
.brand p{margin:2px 0 0;font-size:12.5px;color:var(--ink-2)}

.controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.btn{appearance:none;border:1px solid var(--rule);background:var(--surface-2);color:var(--ink);
     font:600 13px var(--font);padding:9px 14px;border-radius:10px;cursor:pointer;
     transition:background .18s,border-color .18s,transform .12s}
.btn:hover{background:#fff;border-color:var(--teal)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--teal);border-color:var(--teal);color:#fff}
.btn.primary:hover{background:var(--teal-deep);border-color:var(--teal-deep)}
select.btn{padding-right:28px}

/* ---- зона загрузки ---- */
.drop{border:2px dashed var(--rule);border-radius:var(--radius);background:var(--surface);
      padding:44px 24px;text-align:center;transition:border-color .2s,background .2s}
.drop.over{border-color:var(--teal);background:var(--teal-soft)}
.drop h2{margin:0 0 6px;font-size:17px;color:var(--brown)}
.drop p{margin:0 0 16px;color:var(--ink-2);font-size:13px}
.drop small{display:block;margin-top:14px;color:var(--muted);font-size:12px}

.hidden{display:none!important}

/* ---- карточки ---- */
.hero{background:var(--surface);border:1px solid var(--rule);border-radius:var(--radius);
      padding:20px 22px;margin-bottom:14px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-40px;top:-40px;width:180px;height:180px;
             border-radius:50%;background:var(--teal);opacity:.06}
.hero .lbl{font-size:12.5px;color:var(--ink-2);text-transform:uppercase;letter-spacing:.7px}
.hero .val{font-size:40px;font-weight:700;color:var(--brown);line-height:1.1;margin-top:4px;
           font-variant-numeric:tabular-nums}
.hero .sub{margin-top:6px;font-size:13px;color:var(--ink-2)}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));gap:12px;margin-bottom:20px}
.kpi{background:var(--surface);border:1px solid var(--rule);border-radius:var(--radius);padding:14px 16px}
.kpi .k{font-size:12px;color:var(--ink-2);letter-spacing:.3px}
.kpi .v{font-size:22px;font-weight:700;color:var(--brown);margin-top:3px;font-variant-numeric:tabular-nums}
.kpi .u{font-size:12px;color:var(--muted);margin-top:2px}

.panel{background:var(--surface);border:1px solid var(--rule);border-radius:var(--radius);
       padding:18px 20px;margin-bottom:18px;min-width:0}
.panel h3{margin:0 0 2px;font-size:15px;color:var(--brown)}
.panel .cap{margin:0 0 16px;font-size:12.5px;color:var(--ink-2)}

/* ---- переключатель диаграмм ---- */
.tabs{display:inline-flex;background:var(--sand-deep);border-radius:10px;padding:3px;gap:2px;
      position:relative;margin-bottom:4px;max-width:100%;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{white-space:nowrap}
.tabs button{appearance:none;border:0;background:transparent;color:var(--ink-2);cursor:pointer;
             font:600 13px var(--font);padding:7px 14px;border-radius:8px;position:relative;z-index:1;
             transition:color .22s}
.tabs button[aria-selected="true"]{color:#fff}
.tabs .glider{position:absolute;top:3px;bottom:3px;background:var(--teal);border-radius:8px;
              transition:transform .42s cubic-bezier(.22,.85,.3,1),width .42s cubic-bezier(.22,.85,.3,1);z-index:0}

.viz{position:relative;min-height:340px}
.view{position:absolute;inset:0;opacity:0;transform:translateY(10px) scale(.99);
      pointer-events:none;transition:opacity .34s ease,transform .44s cubic-bezier(.22,.85,.3,1)}
.view.on{opacity:1;transform:none;pointer-events:auto;position:relative}

/* ---- горизонтальные столбики ---- */
.bars{display:flex;flex-direction:column;gap:9px}
.bar{display:grid;grid-template-columns:150px 1fr auto;gap:12px;align-items:center}
.bar .nm{font-size:13px;color:var(--ink);text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.bar .track{height:22px;background:var(--sand-deep);border-radius:6px;overflow:hidden;min-width:0}
.bar .fill{height:100%;background:var(--teal);border-radius:0 6px 6px 0;width:0;
           transition:width .7s cubic-bezier(.22,.85,.3,1)}
.bar .vl{font-size:13px;font-weight:600;color:var(--brown);font-variant-numeric:tabular-nums;
         min-width:112px;text-align:right}
.bar:hover .fill{background:var(--teal-deep)}
.bar .sub{grid-column:2/4;font-size:11.5px;color:var(--muted);margin-top:-4px}

/* ---- 100% стек ---- */
.stack{display:flex;height:30px;border-radius:8px;overflow:hidden;background:var(--sand-deep);gap:2px}
.stack span{height:100%;transition:flex-basis .7s cubic-bezier(.22,.85,.3,1);flex-grow:0;flex-shrink:0;
            min-width:0}
.legend{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:12px}
.legend b{display:flex;align-items:center;gap:7px;font:500 12.5px var(--font);color:var(--ink-2)}
.legend i{width:11px;height:11px;border-radius:3px;flex:none}
.legend em{font-style:normal;color:var(--brown);font-weight:600;font-variant-numeric:tabular-nums}

/* ---- линия по дням ---- */
.linewrap{position:relative}
svg.line{width:100%;height:300px;display:block;overflow:visible}
svg.line .grid{stroke:var(--grid);stroke-width:1}
svg.line .axis{stroke:var(--rule);stroke-width:1}
svg.line .area{fill:var(--teal);opacity:.12}
svg.line .path{fill:none;stroke:var(--teal);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
svg.line .dot{fill:var(--teal);stroke:var(--surface);stroke-width:2}
svg.line text{fill:var(--muted);font:11px var(--font)}
svg.line .cross{stroke:var(--teal-deep);stroke-width:1;stroke-dasharray:3 3;opacity:0}
.tip{position:absolute;background:var(--brown);color:#fff;padding:8px 11px;border-radius:8px;
     font:12.5px/1.45 var(--font);pointer-events:none;opacity:0;transition:opacity .15s;
     white-space:nowrap;z-index:5;box-shadow:0 6px 18px rgba(0,0,0,.18)}
.tip b{font-variant-numeric:tabular-nums}

/* ---- панель площадок ---- */
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px}
.chip{appearance:none;border:1px solid var(--rule);background:var(--surface-2);color:var(--ink);
      font:600 13px var(--font);padding:8px 13px;border-radius:999px;cursor:pointer;
      display:flex;align-items:center;gap:8px;transition:background .18s,border-color .18s,color .18s}
.chip:hover{border-color:var(--teal)}
.chip[aria-pressed="true"]{background:var(--teal);border-color:var(--teal);color:#fff}
.chip s{text-decoration:none;font-weight:500;opacity:.75;font-variant-numeric:tabular-nums}
.panel h4{margin:20px 0 9px;font-size:13.5px;color:var(--brown)}
.panel h4:first-child{margin-top:4px}

/* ---- таблица ---- */
.tools{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:12px;align-items:center}
input.f{border:1px solid var(--rule);background:var(--surface-2);border-radius:10px;padding:9px 12px;
        font:13px var(--font);color:var(--ink);min-width:200px}
input.f:focus{outline:2px solid var(--teal);outline-offset:-1px}
.tblwrap{overflow-x:auto;max-width:100%;border:1px solid var(--rule);border-radius:10px;background:var(--surface-2)}
table{border-collapse:collapse;width:100%;font-size:12.5px}
th{background:var(--sand-deep);color:var(--brown);text-align:left;padding:10px 11px;font-weight:700;
   position:sticky;top:0;white-space:nowrap;cursor:pointer;user-select:none}
th:hover{background:var(--teal-soft)}
td{padding:8px 11px;border-top:1px solid var(--grid);white-space:nowrap}
td.n{text-align:right;font-variant-numeric:tabular-nums}
tbody tr:hover{background:var(--teal-soft)}
tfoot td{border-top:2px solid var(--rule);font-weight:700;background:var(--sand-deep);color:var(--brown)}

.note{background:var(--surface-2);border-left:4px solid var(--s4);border-radius:0 10px 10px 0;
      padding:12px 14px;margin-top:10px;font-size:13px;color:var(--ink-2)}
.note b{color:var(--brown)}
.note.err{border-left-color:var(--s8)}
footer{margin-top:26px;padding-top:14px;border-top:1px solid var(--rule);
       font-size:12px;color:var(--muted);display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px}
@media (max-width:760px){
  .app{grid-template-columns:minmax(0,1fr)}.rail{display:none}
  .main{padding:16px 14px 44px}
  .bar{grid-template-columns:110px 1fr}.bar .vl{grid-column:2;text-align:left;min-width:0}
  .hero .val{font-size:30px}
  .tabs button{padding:7px 9px;font-size:12px}
}
</style>

/* ============================ чтение xlsx без библиотек ============================ */
/* xlsx — это zip; распаковку делает встроенный в браузер DecompressionStream,
   поэтому файл работает офлайн и ничего не подгружает. */
async function unzip(buf){
  const dv = new DataView(buf), u8 = new Uint8Array(buf);
  let eocd = -1;
  for (let i = u8.length - 22; i >= 0 && i > u8.length - 66000; i--)
    if (dv.getUint32(i, true) === 0x06054b50){ eocd = i; break; }
  if (eocd < 0) throw new Error("это не xlsx: не найден конец zip-архива");
  const count = dv.getUint16(eocd + 10, true);
  let p = dv.getUint32(eocd + 16, true);
  const files = {};
  for (let i = 0; i < count; i++){
    if (dv.getUint32(p, true) !== 0x02014b50) break;
    const method = dv.getUint16(p + 10, true);
    const csize  = dv.getUint32(p + 20, true);
    const nlen   = dv.getUint16(p + 28, true);
    const elen   = dv.getUint16(p + 30, true);
    const clen   = dv.getUint16(p + 32, true);
    const lho    = dv.getUint32(p + 42, true);
    const name   = new TextDecoder().decode(u8.subarray(p + 46, p + 46 + nlen));
    const lnl = dv.getUint16(lho + 26, true), lel = dv.getUint16(lho + 28, true);
    const start = lho + 30 + lnl + lel;
    files[name] = { method, bytes: u8.subarray(start, start + csize) };
    p += 46 + nlen + elen + clen;
  }
  const out = {};
  for (const [name, f] of Object.entries(files)){
    if (!/\.(xml|rels)$/i.test(name)) continue;
    if (f.method === 0){ out[name] = new TextDecoder().decode(f.bytes); continue; }
    const stream = new Blob([f.bytes]).stream().pipeThrough(new DecompressionStream("deflate-raw"));
    out[name] = await new Response(stream).text();
  }
  return out;
}

const colNum = ref => { let n = 0; for (const ch of ref){ const c = ch.charCodeAt(0);
  if (c < 65 || c > 90) break; n = n * 26 + (c - 64); } return n; };
const rowNum = ref => parseInt(ref.replace(/^[A-Z]+/, ""), 10);
const serialToDate = v => new Date(Math.round((v - 25569) * 86400000));

async function readSheet(buf){
  const parts = await unzip(buf);
  const doc = s => new DOMParser().parseFromString(s, "application/xml");
  const shared = [];
  if (parts["xl/sharedStrings.xml"])
    for (const si of doc(parts["xl/sharedStrings.xml"]).getElementsByTagName("si"))
      shared.push(Array.from(si.getElementsByTagName("t")).map(t => t.textContent).join(""));
  const sheetFile = Object.keys(parts).filter(n => /^xl\/worksheets\/sheet\d+\.xml$/.test(n)).sort()[0];
  if (!sheetFile) throw new Error("в файле нет листов");
  let title = "";
  if (parts["xl/workbook.xml"]){
    const s = doc(parts["xl/workbook.xml"]).getElementsByTagName("sheet")[0];
    if (s) title = s.getAttribute("name") || "";
  }
  const cells = new Map();
  for (const c of doc(parts[sheetFile]).getElementsByTagName("c")){
    const ref = c.getAttribute("r"); if (!ref) continue;
    const t = c.getAttribute("t");
    let val = null;
    if (t === "inlineStr"){
      val = Array.from(c.getElementsByTagName("t")).map(x => x.textContent).join("");
    } else {
      const v = c.getElementsByTagName("v")[0];
      if (!v) continue;
      val = t === "s" ? shared[+v.textContent]
          : (t === "str" || t === "e" ? v.textContent : +v.textContent);
    }
    if (val === null || val === "") continue;
    cells.set(rowNum(ref) + "," + colNum(ref), val);
  }
  return { cells, title, get: (r, c) => cells.get(r + "," + c) };
}

/* ============================ разбор графика санразрыва ============================ */
const HEADER_ROW = 7, COL_FLOOR = 2, FIRST_DAY = 3;
const splitMarks = s => String(s).split(/[\\/|,]+/).map(x => x.trim().toUpperCase()).filter(Boolean);

function parseSchedule(sheet){
  const days = [];
  for (let c = FIRST_DAY; c < FIRST_DAY + 31; c++){
    const v = sheet.get(HEADER_ROW, c);
    if (typeof v === "number" && v > 30000 && v < 60000) days.push({ col: c, date: serialToDate(v) });
  }
  if (!days.length) throw new Error("в строке 7 не найдены даты — похоже, это не график санитарного разрыва");

  /* Раскладка строк жёсткая: каждый цех занимает свой диапазон строк. Если
     строки сдвинуты, птичники молча приписались бы к чужой площадке, поэтому
     сверяем номера этажей: в блоке из N строк должны стоять этажи 1..N
     (порядок бывает любой — у Б и Г он идёт вниз). */
  const layout = [];
  for (const b of DATA.blocks){
    const need = b.to - b.from + 1;
    const got = [];
    for (let r = b.from; r <= b.to; r++){
      const v = sheet.get(r, COL_FLOOR);
      if (v !== undefined && v !== null && String(v).trim() !== "") got.push(Number(v));
    }
    const ok = got.length === need && new Set(got).size === need &&
               Math.min.apply(null, got) === 1 && Math.max.apply(null, got) === need;
    if (!ok)
      layout.push(b.shop + " (строки " + b.from + "–" + b.to + "): ожидались этажи 1–" +
                  need + ", в файле " + (got.length ? got.join(", ") : "пусто"));
  }

  const houses = [], floors = {}, unknown = new Set();
  for (const b of DATA.blocks){
    for (let r = b.from; r <= b.to; r++){
      const floor = sheet.get(r, COL_FLOOR);
      if (floor === undefined || floor === null || floor === "") continue;
      (floors[b.shop] = floors[b.shop] || []).push(floor);
      const events = [];
      for (const d of days){
        const raw = sheet.get(r, d.col);
        if (raw === undefined || raw === null || String(raw).trim() === "") continue;
        for (const m of splitMarks(raw)){
          if (DATA.ops[m]) events.push({ date: d.date, code: DATA.ops[m].code, mark: m });
          else if (!DATA.ignored.includes(m)) unknown.add(m);
        }
      }
      if (events.length) houses.push({ shop: b.shop, floor, events });
    }
  }
  return { houses, floors, days, from: days[0].date, to: days[days.length - 1].date,
           unknown: [...unknown], layout, title: sheet.title };
}

const fmt = (n, d) => (n === null || n === undefined) ? "—"
  : n.toLocaleString("ru-RU", { minimumFractionDigits: d === undefined ? 2 : d,
                                maximumFractionDigits: d === undefined ? 2 : d });
const fmtQ = n => (n === null || n === undefined) ? "—"
  : n.toLocaleString("ru-RU", { maximumFractionDigits: 3 });

function priceOf(agent){
  const position = DATA.map[agent] || agent;
  const p = DATA.prices[position];
  return { position, price: p ? p.price : null, unit: p ? p.unit : "" };
}

function corpsLabel(shops, floors){
  const lab = s => {
    const nums = (floors[s] || []).map(Number).filter(n => !isNaN(n)).sort((a, b) => a - b);
    if (!nums.length) return s;
    const seq = nums.every((n, i) => i === 0 || n === nums[i - 1] + 1);
    return seq ? s + " " + nums[0] + "-" + nums[nums.length - 1] : s + " " + nums.join(", ");
  };
  shops = [...shops].sort();
  if (shops.length === 1) return lab(shops[0]);
  const ranges = new Set(shops.map(s => {
    const n = (floors[s] || []).map(Number).filter(x => !isNaN(x)).sort((a, b) => a - b);
    return n.length ? n[0] + "-" + n[n.length - 1] : "?";
  }));
  if (ranges.size === 1 && !ranges.has("?"))
    return shops[0] + " — " + shops[shops.length - 1] + ", этажи " + [...ranges][0];
  return shops.map(lab).join(", ");
}

function compute(sched, programKey){
  const norms = DATA.programs[programKey];

  /* сколько раз каждая операция проведена: цех | код | номер вхождения в цикле */
  const counts = new Map();
  for (const h of sched.houses){
    const seen = {};
    for (const e of [...h.events].sort((a, b) => a.date - b.date)){
      seen[e.code] = (seen[e.code] || 0) + 1;
      const k = h.shop + "|" + e.code + "|" + seen[e.code];
      counts.set(k, (counts.get(k) || 0) + 1);
    }
  }
  const treatments = (shops, codes, occ) => {
    let n = 0;
    for (const [k, v] of counts){
      const parts = k.split("|");
      if (shops.has(parts[0]) && codes.includes(parts[1]) && (!occ || +parts[2] === occ)) n += v;
    }
    return n;
  };

  const groups = new Map();
  for (const n of norms){
    const key = [n.app, n.proc, n.code, n.occ || "", n.site, n.agent].join("");
    if (!groups.has(key)) groups.set(key, { n, shops: new Set() });
    groups.get(key).shops.add(n.shop);
  }

  const rows = [];
  for (const g of groups.values()){
    const n = g.n;
    const t = treatments(g.shops, n.code.split("+"), n.occ);
    if (!t) continue;                       /* площадки нет в графике этого месяца */
    const pr = priceOf(n.agent);
    const qty = n.norm === null ? null : n.norm * t;
    rows.push({ proc: n.proc, site: n.site, corps: corpsLabel(g.shops, sched.floors),
      agent: pr.position, unit: pr.unit, norm: n.norm, conc: n.conc,
      units: t, times: 1, qty, price: pr.price,
      sum: (qty !== null && pr.price !== null) ? qty * pr.price : null,
      graph: true, code: n.code, note: pr.price === null ? "нет цены в прайсе" : "" });
  }

  const shopsInFile = new Set(Object.keys(sched.floors));
  for (const e of DATA.extra){
    const pr = priceOf(e.agent);
    const qty = e.norm * e.units * e.times;
    const known = e.shops.filter(s => shopsInFile.has(s));
    rows.push({ proc: e.proc, site: e.site,
      corps: e.shops[0] === "все" ? "все площадки"
                                  : corpsLabel(known.length ? known : e.shops, sched.floors),
      agent: pr.position, unit: pr.unit, norm: e.norm, conc: null,
      units: e.units, times: e.times, qty, price: pr.price,
      sum: pr.price !== null ? qty * pr.price : null,
      graph: false, code: "—", note: pr.price === null ? "нет цены в прайсе" : (e.note || "") });
  }

  const ORDER = ["ОС","МС","ПР","ДС","ДЗ","ГГ","ГФ","ОД","ПДГ","СО","—"];
  rows.sort((a, b) => (ORDER.indexOf(a.code) - ORDER.indexOf(b.code)) ||
                      a.proc.localeCompare(b.proc, "ru") || a.site.localeCompare(b.site, "ru"));

  /* расход по дням — только работы по графику */
  const lookup = new Map();
  for (const n of norms){
    const k = n.shop + "|" + n.code + "|" + (n.occ || 0);
    if (!lookup.has(k)) lookup.set(k, []);
    lookup.get(k).push(n);
  }
  const daily = new Map();
  for (const h of sched.houses){
    const seen = {};
    for (const e of [...h.events].sort((a, b) => a.date - b.date)){
      seen[e.code] = (seen[e.code] || 0) + 1;
      const hit = (lookup.get(h.shop + "|" + e.code + "|" + seen[e.code]) || [])
        .concat(lookup.get(h.shop + "|" + e.code + "|0") || []);
      for (const n of hit){
        if (n.norm === null) continue;
        const price = priceOf(n.agent).price;
        const key = e.date.toISOString().slice(0, 10);
        const cur = daily.get(key) || { sum: 0, ops: 0 };
        cur.sum += price === null ? 0 : n.norm * price;
        cur.ops += 1;
        daily.set(key, cur);
      }
    }
  }

  const checks = [];
  for (const l of sched.layout)
    checks.push("Раскладка строк не совпадает с ожидаемой: " + l +
      ". Птичники могли попасть не на свою площадку — сверьте файл с обычным графиком.");
  if (sched.unknown.length)
    checks.push("В графике встретились незнакомые отметки: " + sched.unknown.join(", ") + " — они не учтены.");
  const covered = new Set(rows.flatMap(r => r.code.split("+")).concat(["ОЧН", "—"]));
  const inFile = new Set(sched.houses.flatMap(h => h.events.map(e => e.code)));
  for (const c of [...inFile].filter(x => !covered.has(x)).sort()){
    const times = sched.houses.reduce((s, h) => s + h.events.filter(e => e.code === c).length, 0);
    checks.push("Отметка " + c + " есть в графике (" + times +
                " раз), но нормы в санитарной программе нет — расход по ней не посчитан.");
  }
  for (const r of rows) if (r.price === null)
    checks.push("Нет цены в прайсе: " + r.agent + " — расход посчитан, сумма нет.");

  return { rows, daily, checks: [...new Set(checks)] };
}
</script>

<script>
"use strict";
const SERIES = ["--s1","--s2","--s3","--s4","--s5","--s6","--s7","--s8"]
  .map(v => getComputedStyle(document.documentElement).getPropertyValue(v).trim());
const el = (tag, cls, html) => { const n = document.createElement(tag);
  if (cls) n.className = cls; if (html !== undefined) n.innerHTML = html; return n; };
const MONTHS = ["января","февраля","марта","апреля","мая","июня",
                "июля","августа","сентября","октября","ноября","декабря"];
const ruDate = d => d.getDate() + " " + MONTHS[d.getMonth()];

let STATE = { sched: null, calc: null, program: null, view: "sites", sort: { key: "sum", dir: -1 }, q: "" };

/* ---------------- агрегаты ---------------- */
const groupSum = (rows, key) => {
  const m = new Map();
  for (const r of rows){
    const k = typeof key === "function" ? key(r) : r[key];
    const cur = m.get(k) || { name: k, sum: 0, qty: 0, unit: r.unit, ops: 0 };
    cur.sum += r.sum || 0; cur.qty += r.qty || 0; cur.ops += r.units * r.times;
    if (cur.unit !== r.unit) cur.unit = "";
    m.set(k, cur);
  }
  return [...m.values()].sort((a, b) => b.sum - a.sum);
};

/* ---------------- столбики ---------------- */
function bars(host, items, opts){
  opts = opts || {};
  host.innerHTML = "";
  const wrap = el("div", "bars");
  const max = Math.max(...items.map(i => i.sum), 1);
  items.forEach((it, idx) => {
    const row = el("div", "bar");
    row.appendChild(el("div", "nm", it.name));
    const track = el("div", "track");
    const fill = el("div", "fill");
    track.appendChild(fill);
    row.appendChild(track);
    row.appendChild(el("div", "vl", fmt(it.sum, 0) + " ₸"));
    if (opts.sub) row.appendChild(el("div", "sub", opts.sub(it)));
    row.title = it.name + ": " + fmt(it.sum) + " ₸" + (opts.sub ? " · " + opts.sub(it) : "");
    wrap.appendChild(row);
    requestAnimationFrame(() => setTimeout(() => {
      fill.style.width = (it.sum / max * 100).toFixed(2) + "%";
    }, 40 + idx * 45));
  });
  host.appendChild(wrap);
}

/* ---------------- линия по дням ---------------- */
function lineChart(host, points){
  host.innerHTML = "";
  if (points.length < 2){ host.appendChild(el("p", "cap", "Для линии нужно минимум два дня с работами.")); return; }
  const wrap = el("div", "linewrap");
  const W = 1000, H = 300, L = 64, R = 12, T = 14, B = 34;
  const max = Math.max(...points.map(p => p.sum)) * 1.08 || 1;
  const x = i => L + i * (W - L - R) / (points.length - 1);
  const y = v => T + (1 - v / max) * (H - T - B);

  const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  svg.setAttribute("class", "line");
  svg.setAttribute("viewBox", "0 0 " + W + " " + H);
  svg.setAttribute("preserveAspectRatio", "none");
  const add = (tag, attrs, text) => {
    const n = document.createElementNS("http://www.w3.org/2000/svg", tag);
    for (const [k, v] of Object.entries(attrs)) n.setAttribute(k, v);
    if (text !== undefined) n.textContent = text;
    svg.appendChild(n); return n;
  };
  for (let g = 0; g <= 4; g++){
    const v = max * g / 4;
    add("line", { class: "grid", x1: L, x2: W - R, y1: y(v), y2: y(v) });
    add("text", { x: L - 8, y: y(v) + 4, "text-anchor": "end" },
        (v / 1000).toLocaleString("ru-RU", { maximumFractionDigits: 0 }) + " тыс.");
  }
  add("line", { class: "axis", x1: L, x2: W - R, y1: y(0), y2: y(0) });
  const step = Math.ceil(points.length / 12);
  points.forEach((p, i) => { if (i % step === 0)
    add("text", { x: x(i), y: H - 12, "text-anchor": "middle" }, p.date.getDate()); });

  const d = points.map((p, i) => (i ? "L" : "M") + x(i).toFixed(1) + " " + y(p.sum).toFixed(1)).join(" ");
  add("path", { class: "area", d: d + " L" + x(points.length - 1) + " " + y(0) + " L" + x(0) + " " + y(0) + " Z" });
  const path = add("path", { class: "path", d });
  const len = path.getTotalLength ? path.getTotalLength() : 2000;
  path.style.strokeDasharray = len; path.style.strokeDashoffset = len;
  requestAnimationFrame(() => { path.style.transition = "stroke-dashoffset 1s ease"; path.style.strokeDashoffset = 0; });

  const cross = add("line", { class: "cross", y1: T, y2: y(0) });
  const dot = add("circle", { class: "dot", r: 5, opacity: 0 });
  const tip = el("div", "tip");
  wrap.appendChild(svg); wrap.appendChild(tip);

  svg.addEventListener("pointermove", ev => {
    const box = svg.getBoundingClientRect();
    const px = (ev.clientX - box.left) / box.width * W;
    let i = Math.round((px - L) / ((W - L - R) / (points.length - 1)));
    i = Math.max(0, Math.min(points.length - 1, i));
    const p = points[i];
    cross.setAttribute("x1", x(i)); cross.setAttribute("x2", x(i)); cross.style.opacity = .8;
    dot.setAttribute("cx", x(i)); dot.setAttribute("cy", y(p.sum)); dot.setAttribute("opacity", 1);
    tip.innerHTML = "<b>" + ruDate(p.date) + "</b><br>" + fmt(p.sum) + " ₸ · " + p.ops + " работ";
    const left = x(i) / W * box.width;
    tip.style.left = Math.min(Math.max(left - 60, 0), box.width - 150) + "px";
    tip.style.top = (y(p.sum) / H * box.height - 58) + "px";
    tip.style.opacity = 1;
  });
  svg.addEventListener("pointerleave", () => {
    cross.style.opacity = 0; dot.setAttribute("opacity", 0); tip.style.opacity = 0;
  });
  host.appendChild(wrap);
}

/* ---------------- структура по процессам ---------------- */
function structure(host, rows){
  const all = groupSum(rows, "proc").filter(g => g.sum > 0);
  const top = all.slice(0, 7);
  const rest = all.slice(7);
  if (rest.length) top.push({ name: "Прочие процессы (" + rest.length + ")",
                              sum: rest.reduce((s, r) => s + r.sum, 0) });
  const total = top.reduce((s, r) => s + r.sum, 0) || 1;
  host.innerHTML = "";
  const stack = el("div", "stack");
  const legend = el("div", "legend");
  top.forEach((g, i) => {
    const seg = el("span");
    seg.style.background = SERIES[i % SERIES.length];
    seg.style.flexBasis = "0%";
    seg.title = g.name + ": " + fmt(g.sum) + " ₸";
    stack.appendChild(seg);
    const b = el("b");
    const dot = el("i"); dot.style.background = SERIES[i % SERIES.length];
    b.appendChild(dot);
    b.appendChild(document.createTextNode(g.name + " "));
    b.appendChild(el("em", null, (g.sum / total * 100).toFixed(1).replace(".", ",") + " %"));
    legend.appendChild(b);
    requestAnimationFrame(() => setTimeout(() => {
      seg.style.flexBasis = (g.sum / total * 100).toFixed(3) + "%";
    }, 60 + i * 60));
  });
  host.appendChild(stack); host.appendChild(legend);
}


/* ---------------- панель площадок ---------------- */
const siteOf = shop => {
  for (const [site, shops] of Object.entries(DATA.sites)) if (shops.includes(shop)) return site;
  return shop;
};

function sitesPanel(host, sched, calc){
  /* по каждому цеху: какие этажи есть в графике и какие реально зашли в санразрыв */
  const inWork = {};
  for (const h of sched.houses) (inWork[h.shop] = inWork[h.shop] || new Set()).add(String(h.floor));

  const sites = {};
  for (const [shop, floors] of Object.entries(sched.floors)){
    const site = siteOf(shop);
    const s = sites[site] || (sites[site] = { site, shops: [], houses: 0, inHouses: 0,
                                              corps: 0, inCorps: 0 });
    const done = inWork[shop] || new Set();
    s.shops.push({ shop, floors: floors.map(String), done });
    s.houses += floors.length; s.inHouses += done.size;
    s.corps += 1; s.inCorps += done.size ? 1 : 0;
  }
  for (const s of Object.values(sites)){
    const rows = calc.rows.filter(r => r.site === s.site);
    s.sum   = rows.filter(r => r.graph).reduce((a, r) => a + (r.sum || 0), 0);
    s.extra = rows.filter(r => !r.graph).reduce((a, r) => a + (r.sum || 0), 0);
  }

  const order = Object.values(sites).sort((a, b) => b.sum - a.sum);
  let current = order.length ? order[0].site : null;

  const chips = el("div", "chips");
  const body = el("div");
  host.innerHTML = ""; host.appendChild(chips); host.appendChild(body);

  order.forEach(s => {
    const c = el("button", "chip");
    c.innerHTML = s.site + " <s>" + s.inHouses + "/" + s.houses + "</s>";
    c.setAttribute("aria-pressed", s.site === current);
    c.onclick = () => {
      current = s.site;
      chips.querySelectorAll(".chip").forEach((b, i) =>
        b.setAttribute("aria-pressed", order[i].site === current));
      draw();
    };
    chips.appendChild(c);
  });

  function draw(){
    const s = sites[current];
    if (!s) return;
    body.innerHTML = "";

    const kp = el("div", "kpis");
    const mini = (k, v, u) => { const n = el("div", "kpi");
      n.appendChild(el("div", "k", k)); n.appendChild(el("div", "v", v));
      if (u) n.appendChild(el("div", "u", u)); return n; };
    const ops = sched.houses.filter(h => siteOf(h.shop) === current)
                            .reduce((a, h) => a + h.events.length, 0);
    kp.appendChild(mini("Корпусов в санразрыве", s.inCorps + " из " + s.corps,
      s.shops.map(x => x.shop).join(", ")));
    kp.appendChild(mini("Птичников в санразрыве", s.inHouses + " из " + s.houses,
      s.houses ? Math.round(s.inHouses / s.houses * 100) + " % площадки" : ""));
    kp.appendChild(mini("Отметок в графике", String(ops), "учитываемых операций"));
    kp.appendChild(mini("Сумма по графику", fmt(s.sum, 0) + " ₸",
      s.inHouses ? fmt(s.sum / s.inHouses, 0) + " ₸ на птичник" : ""));
    kp.appendChild(mini("Вне графика", fmt(s.extra, 0) + " ₸", "дератизация на площадке"));
    kp.appendChild(mini("Всего по площадке", fmt(s.sum + s.extra, 0) + " ₸",
      "по графику плюс вне графика"));
    body.appendChild(kp);

    /* корпуса площадки: сколько птичников вошло и какие работы на них прошли */
    const ORDER = ["ОС","МС","ПР","ДС","ДЗ","ГГ","ГФ","ОД","ПДГ","СО"];
    const perShop = {};
    for (const h of sched.houses){
      if (siteOf(h.shop) !== current) continue;
      const m = perShop[h.shop] = perShop[h.shop] || {};
      for (const e of h.events) m[e.code] = (m[e.code] || 0) + 1;
    }
    const used = ORDER.filter(c => Object.values(perShop).some(m => m[c]));
    const names = {};
    for (const o of Object.values(DATA.ops)) names[o.code] = o.name;

    body.appendChild(el("h4", null, "Корпуса площадки " + current));
    let html = "<div class='tblwrap'><table><thead><tr>" +
      "<th>Корпус</th><th>Птичников всего</th><th>Вошло в санразрыв</th><th>Какие птичники</th>" +
      used.map(c => "<th title='" + (names[c] || c) + "'>" + c + "</th>").join("") +
      "</tr></thead><tbody>";
    const shops = [...s.shops].sort((a, b) => a.shop.localeCompare(b.shop, "ru"));
    for (const c of shops){
      const nums = c.floors.filter(f => c.done.has(f));
      const m = perShop[c.shop] || {};
      html += "<tr><td>" + c.shop + "</td>" +
              "<td class='n'>" + c.floors.length + "</td>" +
              "<td class='n'>" + (c.done.size || "—") + "</td>" +
              "<td>" + (nums.length ? nums.join(", ") : "не входил") + "</td>" +
              used.map(k => "<td class='n'>" + (m[k] || "") + "</td>").join("") + "</tr>";
    }
    const tot = {};
    for (const m of Object.values(perShop)) for (const [k, v] of Object.entries(m)) tot[k] = (tot[k] || 0) + v;
    html += "</tbody><tfoot><tr><td>Итого " + current + "</td>" +
            "<td class='n'>" + s.houses + "</td><td class='n'>" + s.inHouses + "</td><td></td>" +
            used.map(k => "<td class='n'>" + (tot[k] || "") + "</td>").join("") +
            "</tr></tfoot></table></div>";
    body.appendChild(el("div", null, html));
    if (used.length)
      body.appendChild(el("p", "cap",
        "Колонки — коды работ: " + used.map(c => c + " — " + (names[c] || c)).join(", ") + "."));

    /* работы по графику и вне его считаются по-разному, поэтому разделены
       и подытожены отдельно — иначе непонятно, откуда расходятся цифры */
    const all = calc.rows.filter(r => r.site === current);
    const byGraph = all.filter(r => r.graph).sort((a, b) => (b.sum || 0) - (a.sum || 0));
    const offGraph = all.filter(r => !r.graph).sort((a, b) => (b.sum || 0) - (a.sum || 0));
    body.appendChild(el("h4", null, "Чем и сколько израсходовано на площадке " + current));
    const line = r => "<tr><td>" + r.proc + "</td><td>" + r.agent + "</td>" +
      "<td class='n'>" + fmtQ(r.norm) + "</td><td>" + r.unit + "</td>" +
      "<td class='n'>" + r.units + "</td><td class='n'>" + r.times + "</td>" +
      "<td class='n'>" + fmtQ(r.qty) + "</td><td class='n'>" + fmt(r.price) + "</td>" +
      "<td class='n'>" + fmt(r.sum) + "</td></tr>";
    const sub = (label, rows) => "<tr><td colspan='8' style='font-weight:700'>" + label +
      "</td><td class='n' style='font-weight:700'>" +
      fmt(rows.reduce((a, r) => a + (r.sum || 0), 0)) + "</td></tr>";
    let h2 = "<div class='tblwrap'><table><thead><tr>" +
      "<th>Процесс</th><th>Дезсредство</th><th>Норма</th><th>Ед.</th>" +
      "<th>Птичников</th><th>Раз в месяц</th><th>Расход</th><th>Цена</th><th>Сумма</th>" +
      "</tr></thead><tbody>";
    h2 += byGraph.map(line).join("");
    if (byGraph.length) h2 += sub("Итого по графику санразрыва", byGraph);
    if (offGraph.length){
      h2 += "<tr><td colspan='9' style='background:var(--sand-deep);color:var(--brown);" +
            "font-weight:700'>Вне графика санразрыва — идёт по своему графику независимо от " +
            "санразрыва</td></tr>";
      h2 += offGraph.map(line).join("");
      h2 += sub("Итого вне графика", offGraph);
    }
    h2 += "</tbody><tfoot><tr><td colspan='8'>ВСЕГО по площадке " + current + "</td><td class='n'>" +
          fmt(all.reduce((a, r) => a + (r.sum || 0), 0)) + "</td></tr></tfoot></table></div>";
    body.appendChild(el("div", null, h2));
  }
  draw();
}

/* ---------------- таблица ---------------- */
const COLS = [
  { k: "proc",  t: "Процесс" },
  { k: "site",  t: "Площадка" },
  { k: "corps", t: "Корпуса" },
  { k: "agent", t: "Наименование дезсредства" },
  { k: "unit",  t: "Ед." },
  { k: "norm",  t: "Норма", n: 1 },
  { k: "conc",  t: "Конц.", n: 1, pct: true },
  { k: "units", t: "Входят в сан разрыв", n: 1 },
  { k: "times", t: "Раз в месяц", n: 1 },
  { k: "qty",   t: "Расход за месяц", n: 1 },
  { k: "price", t: "Цена за ед.", n: 1, money: true },
  { k: "sum",   t: "Сумма", n: 1, money: true },
  { k: "note",  t: "Замечания" }
];

function table(host){
  const rows = STATE.calc.rows.filter(r => {
    if (!STATE.q) return true;
    const q = STATE.q.toLowerCase();
    return (r.proc + " " + r.site + " " + r.corps + " " + r.agent).toLowerCase().includes(q);
  });
  const { key, dir } = STATE.sort;
  rows.sort((a, b) => {
    const x = a[key], y = b[key];
    if (typeof x === "number" || typeof y === "number") return ((x || 0) - (y || 0)) * dir;
    return String(x || "").localeCompare(String(y || ""), "ru") * dir;
  });
  const total = rows.reduce((s, r) => s + (r.sum || 0), 0);
  let html = "<table><thead><tr>";
  for (const c of COLS) html += "<th data-k='" + c.k + "'>" + c.t +
    (STATE.sort.key === c.k ? (dir > 0 ? " ▲" : " ▼") : "") + "</th>";
  html += "</tr></thead><tbody>";
  for (const r of rows){
    html += "<tr>";
    for (const c of COLS){
      const v = r[c.k];
      let s;
      if (v === null || v === undefined || v === "") s = c.n ? "—" : "";
      else if (c.pct) s = (v * 100).toLocaleString("ru-RU", { maximumFractionDigits: 1 }) + " %";
      else if (c.money) s = fmt(v);
      else if (c.n) s = fmtQ(v);
      else s = String(v);
      html += "<td class='" + (c.n ? "n" : "") + "'>" + s + "</td>";
    }
    html += "</tr>";
  }
  html += "</tbody><tfoot><tr><td colspan='11'>ИТОГО по " + rows.length + " строкам</td>" +
          "<td class='n'>" + fmt(total) + "</td><td></td></tr></tfoot></table>";
  host.innerHTML = html;
  host.querySelectorAll("th").forEach(th => th.onclick = () => {
    const k = th.dataset.k;
    STATE.sort = { key: k, dir: STATE.sort.key === k ? -STATE.sort.dir : -1 };
    table(host);
  });
}

/* ---------------- сборка страницы ---------------- */
function render(){
  const { sched, calc } = STATE;
  const out = document.getElementById("out");
  out.innerHTML = "";
  out.classList.remove("hidden");

  const graph = calc.rows.filter(r => r.graph).reduce((s, r) => s + (r.sum || 0), 0);
  const extra = calc.rows.filter(r => !r.graph).reduce((s, r) => s + (r.sum || 0), 0);
  /* отметки считаем по самому графику: по строкам норм одна и та же отметка
     попадает в несколько приложений и счёт задваивается */
  const ops = sched.houses.reduce((s, h) => s + h.events.length, 0);
  const agents = new Set(calc.rows.filter(r => r.sum !== null).map(r => r.agent)).size;

  const period = ruDate(sched.from) + " — " + ruDate(sched.to) + " " + sched.to.getFullYear();
  document.getElementById("src").textContent = "Источник: " + (sched.title || "лист графика") +
    " · " + period + " · нормы: " + STATE.program;

  const layoutBad = calc.checks.filter(c => c.startsWith("Раскладка"));
  if (layoutBad.length){
    const warn = el("div", "panel");
    warn.style.borderColor = "#A33A2E";
    warn.appendChild(el("h3", null, "Внимание: раскладка файла отличается от обычной"));
    layoutBad.forEach(c => warn.appendChild(el("div", "note err", c)));
    out.appendChild(warn);
  }

  const hero = el("div", "hero");
  hero.appendChild(el("div", "lbl", "Расход дезсредств за период"));
  hero.appendChild(el("div", "val", fmt(graph + extra) + " ₸"));
  hero.appendChild(el("div", "sub", period + " · " + sched.title));
  out.appendChild(hero);

  const kpis = el("div", "kpis");
  const kpi = (k, v, u) => { const n = el("div", "kpi");
    n.appendChild(el("div", "k", k)); n.appendChild(el("div", "v", v));
    if (u) n.appendChild(el("div", "u", u)); return n; };
  kpis.appendChild(kpi("По графику санразрыва", fmt(graph, 0) + " ₸",
    (graph / (graph + extra) * 100).toFixed(0) + " % итога"));
  kpis.appendChild(kpi("Вне графика", fmt(extra, 0) + " ₸", "дератизация, барьеры, руки, коврики"));
  kpis.appendChild(kpi("Птичников в санразрыве", String(sched.houses.length), "из 122 по программе"));
  kpis.appendChild(kpi("Отметок в графике", String(ops), "учитываемых операций"));
  kpis.appendChild(kpi("Средств задействовано", String(agents), "позиций прайса"));
  out.appendChild(kpis);

  const pStruct = el("div", "panel");
  pStruct.appendChild(el("h3", null, "Структура расхода по процессам"));
  pStruct.appendChild(el("p", "cap", "Доля каждого процесса в общей сумме за период"));
  const structHost = el("div");
  pStruct.appendChild(structHost);
  out.appendChild(pStruct);
  structure(structHost, calc.rows);

  const pSites = el("div", "panel");
  pSites.appendChild(el("h3", null, "Разбор по площадке"));
  pSites.appendChild(el("p", "cap",
    "Выберите площадку — видно, какие корпуса и птичники вошли в санразрыв и чем их обрабатывали"));
  const sitesHost = el("div");
  pSites.appendChild(sitesHost);
  out.appendChild(pSites);
  sitesPanel(sitesHost, sched, calc);

  const pViz = el("div", "panel");
  pViz.appendChild(el("h3", null, "Разрезы расхода"));
  pViz.appendChild(el("p", "cap", "Переключайте разрез — данные те же, взгляд разный"));
  const tabs = el("div", "tabs");
  const glider = el("div", "glider");
  tabs.appendChild(glider);
  const VIEWS = [
    { id: "sites",   t: "По площадкам" },
    { id: "agents",  t: "По дезсредствам" },
    { id: "procs",   t: "По процессам" },
    { id: "days",    t: "По дням" }
  ];
  const viz = el("div", "viz");
  const hosts = {};
  VIEWS.forEach(v => {
    const b = el("button", null, v.t);
    b.setAttribute("aria-selected", v.id === STATE.view);
    b.onclick = () => switchTo(v.id);
    tabs.appendChild(b);
    const view = el("div", "view" + (v.id === STATE.view ? " on" : ""));
    hosts[v.id] = view; viz.appendChild(view);
  });
  pViz.appendChild(tabs); pViz.appendChild(viz);
  out.appendChild(pViz);

  function fill(id){
    const host = hosts[id];
    if (id === "sites")
      bars(host, groupSum(calc.rows.filter(r => r.graph), "site"),
           { sub: g => g.ops + " обработок" });
    if (id === "agents")
      bars(host, groupSum(calc.rows, "agent").slice(0, 12),
           { sub: g => fmtQ(g.qty) + " " + (g.unit || "") });
    if (id === "procs")
      bars(host, groupSum(calc.rows, "proc"), { sub: g => g.ops + " работ" });
    if (id === "days"){
      const pts = [...calc.daily.entries()].sort()
        .map(([d, v]) => ({ date: new Date(d + "T00:00:00"), sum: v.sum, ops: v.ops }));
      lineChart(host, pts);
    }
  }
  function moveGlider(){
    const btns = [...tabs.querySelectorAll("button")];
    const i = VIEWS.findIndex(v => v.id === STATE.view);
    const b = btns[i]; if (!b) return;
    glider.style.width = b.offsetWidth + "px";
    glider.style.transform = "translateX(" + (b.offsetLeft - 3) + "px)";
  }
  function switchTo(id){
    if (id === STATE.view) return;
    STATE.view = id;
    tabs.querySelectorAll("button").forEach((b, i) =>
      b.setAttribute("aria-selected", VIEWS[i].id === id));
    Object.entries(hosts).forEach(([k, h]) => h.classList.toggle("on", k === id));
    fill(id); moveGlider();
  }
  fill(STATE.view);
  requestAnimationFrame(moveGlider);
  window.addEventListener("resize", moveGlider);

  const pTbl = el("div", "panel");
  pTbl.appendChild(el("h3", null, "Полная расшифровка"));
  pTbl.appendChild(el("p", "cap", "Расход = норма × входят в сан разрыв × раз в месяц. Сумма = расход × цена"));
  const tools = el("div", "tools");
  const inp = el("input", "f"); inp.type = "search";
  inp.placeholder = "Фильтр: площадка, средство, процесс…";
  inp.oninput = () => { STATE.q = inp.value; table(tblHost); };
  tools.appendChild(inp);
  pTbl.appendChild(tools);
  const tblHost = el("div", "tblwrap");
  pTbl.appendChild(tblHost);
  out.appendChild(pTbl);
  table(tblHost);

  if (calc.checks.length){
    const pChk = el("div", "panel");
    pChk.appendChild(el("h3", null, "Проверки"));
    calc.checks.forEach(c => pChk.appendChild(
      el("div", "note" + (c.startsWith("Раскладка") ? " err" : ""), c)));
    out.appendChild(pChk);
  }
  document.getElementById("csv").classList.remove("hidden");
}

/* ---------------- выгрузка ---------------- */
function toCSV(){
  const head = COLS.map(c => c.t).join(";");
  const lines = STATE.calc.rows.map(r => COLS.map(c => {
    const v = r[c.k];
    if (v === null || v === undefined) return "";
    return typeof v === "number" ? String(v).replace(".", ",") : String(v).replace(/;/g, ",");
  }).join(";"));
  const total = STATE.calc.rows.reduce((s, r) => s + (r.sum || 0), 0);
  lines.push(["ИТОГО", "", "", "", "", "", "", "", "", "", "",
              String(total.toFixed(2)).replace(".", ","), ""].join(";"));
  const blob = new Blob(["﻿" + head + "\n" + lines.join("\n")],
                        { type: "text/csv;charset=utf-8" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "raschet-dezsredstv.csv";
  a.click(); URL.revokeObjectURL(a.href);
}

/* ---------------- загрузка файла ---------------- */
const dz = document.getElementById("dropzone");
const fileInput = document.getElementById("file");
const progSel = document.getElementById("prog");
Object.keys(DATA.programs).forEach(k => {
  const o = document.createElement("option"); o.value = k; o.textContent = k;
  progSel.appendChild(o);
});
progSel.value = Object.keys(DATA.programs)[1] || Object.keys(DATA.programs)[0];
STATE.program = progSel.value;
progSel.onchange = () => { STATE.program = progSel.value;
  if (STATE.sched){ STATE.calc = compute(STATE.sched, STATE.program); render(); } };

document.getElementById("pick").onclick = () => fileInput.click();
document.getElementById("again").onclick = () => {
  dz.classList.remove("hidden"); document.getElementById("out").classList.add("hidden");
  document.getElementById("csv").classList.add("hidden");
  window.scrollTo({ top: 0, behavior: "smooth" });
};
document.getElementById("csv").onclick = toCSV;
fileInput.onchange = () => fileInput.files[0] && load(fileInput.files[0]);
["dragenter","dragover"].forEach(e => dz.addEventListener(e, ev => {
  ev.preventDefault(); dz.classList.add("over"); }));
["dragleave","drop"].forEach(e => dz.addEventListener(e, ev => {
  ev.preventDefault(); dz.classList.remove("over"); }));
dz.addEventListener("drop", ev => { const f = ev.dataTransfer.files[0]; if (f) load(f); });

async function load(file){
  dz.innerHTML = "<h2>Читаю " + file.name + "…</h2><p>разбор идёт в браузере</p>";
  try {
    const sheet = await readSheet(await file.arrayBuffer());
    const sched = parseSchedule(sheet);
    if (!sched.houses.length) throw new Error("в графике нет ни одной учитываемой отметки");
    STATE.sched = sched;
    STATE.calc = compute(sched, STATE.program);
    dz.classList.add("hidden");
    render();
  } catch (err){
    dz.innerHTML = "<h2>Не получилось прочитать файл</h2>" +
      "<div class='note err'><b>" + (err && err.message ? err.message : err) + "</b></div>" +
      "<p style='margin-top:14px'>Нужен .xlsx с графиком санитарного разрыва: " +
      "даты в строке 7, цеха и этажи слева.</p>" +
      "<button class='btn primary' onclick='document.getElementById(\"file\").click()'>Выбрать другой файл</button>";
    dz.classList.remove("hidden");
  }
}

/* логотип: вшивается при сборке или выбирается вручную и запоминается в браузере */
(function logo(){
  const img = document.getElementById("logo");
  const word = document.getElementById("wordmark");
  const show = src => {
    if (!src) return;
    img.src = src; img.classList.remove("hidden"); word.classList.add("hidden");
  };
  let saved = null;
  try { saved = localStorage.getItem("ukpf-logo"); } catch (e) {}
  show(window.BUILT_IN_LOGO || saved);

  const input = document.getElementById("logofile");
  document.getElementById("logobtn").onclick = () => input.click();
  input.onchange = () => {
    const f = input.files[0]; if (!f) return;
    const fr = new FileReader();
    fr.onload = () => {
      show(fr.result);
      try { localStorage.setItem("ukpf-logo", fr.result); } catch (e) {}
    };
    fr.readAsDataURL(f);
  };
})();
