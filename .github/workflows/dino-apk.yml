# Сборка APK игры «Меловой остров» из папки dino/.
# Готовый файл появляется в разделе Releases и во вкладке Actions.
name: Меловой остров — APK

on:
  push:
    branches: [claude/dinosaur-task-d3xtwp]
    paths: ['dino/**', '.github/workflows/dino-apk.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dino
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      # Android SDK уже установлен на раннерах ubuntu-latest (ANDROID_HOME)
      - name: Лицензии Android SDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Зависимости
        run: npm ci

      - name: Веб-часть в APK
        run: npm run sync

      - name: Сборка
        working-directory: dino/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Имя файла
        run: cp android/app/build/outputs/apk/debug/app-debug.apk ../melovoy-ostrov.apk

      - uses: actions/upload-artifact@v4
        with:
          name: melovoy-ostrov-apk
          path: melovoy-ostrov.apk

      - name: Релиз для скачивания с телефона
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dino-build-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: Меловой остров, сборка ${{ github.run_number }}
          body: Скачайте melovoy-ostrov.apk на телефон и установите (разрешите установку из неизвестных источников).
          files: melovoy-ostrov.apk
