<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Video Studio</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <h1>🎬 Video Studio</h1>
    <div id="health" class="health">подключение...</div>
  </header>

  <main class="layout">
    <section class="panel create-panel">
      <h2>Ключ OpenAI</h2>
      <form id="key-form" class="key-form">
        <div id="key-status" class="key-status">проверяю...</div>
        <input type="password" name="key" placeholder="sk-..." autocomplete="off" />
        <button type="submit">Сохранить ключ</button>
        <p class="key-hint">Без ключа студия работает на бесплатных API — качество заметно ниже.</p>
      </form>

      <h2 class="section-gap">Ключ Google (Veo)</h2>
      <form id="veo-form" class="key-form">
        <div id="veo-status" class="key-status">проверяю...</div>
        <input type="password" name="key" placeholder="AIza..." autocomplete="off" />
        <button type="submit">Сохранить ключ</button>
        <p class="key-hint">Нужен только для анимации через Veo. Берётся на aistudio.google.com.</p>
      </form>

      <h2 class="section-gap">Новое задание</h2>
      <form id="create-form">
        <label>Тема
          <textarea name="topic" rows="2" placeholder="Например: Викинги — походы и грабежи" required></textarea>
        </label>
        <label>Персонаж
          <textarea name="characterSheet" rows="2"
            placeholder="Например: a chubby orange tabby cat in a blue spacesuit"></textarea>
          <span class="hint">Задайте, чтобы продолжить серию тем же героем. Пусто — придумает сам.</span>
        </label>
        <label>Подача
          <input type="text" name="delivery" placeholder="Историко-документальная" />
        </label>
        <label>Формат
          <select name="format">
            <option value="long">Long (документалка)</option>
            <option value="short">Short (вертикальное)</option>
          </select>
        </label>
        <label>Визуальный стиль
          <select name="visualStyle">
            <option value="realism">Реализм</option>
            <option value="illustration">Иллюстрация</option>
            <option value="cinematic">Кинематографично</option>
            <option value="cartoon2d">Мультфильм 2D</option>
            <option value="cartoon3d">3D-анимация</option>
            <option value="anime">Аниме</option>
          </select>
        </label>
        <label>Модель анимации
          <select name="videoProvider">
            <option value="openai">Sora (OpenAI)</option>
            <option value="veo">Veo (Google)</option>
          </select>
        </label>
        <label>Анимация
          <select name="animation">
            <option value="none">Выкл — картинки с зумом (дёшево)</option>
            <option value="first">Только первая сцена (проверить)</option>
            <option value="all">Все сцены (дорого)</option>
          </select>
        </label>
        <label class="checkbox">
          <input type="checkbox" name="continuousMotion" />
          Непрерывное действие
        </label>
        <label class="checkbox">
          <input type="checkbox" name="historicalAccuracy" checked />
          Историческая точность
        </label>
        <label class="checkbox">
          <input type="checkbox" name="materialsProfile" checked />
          Профиль материалов
        </label>
        <button type="submit">Создать и запустить</button>
      </form>
    </section>

    <section class="panel jobs-panel">
      <h2>Задания</h2>
      <ul id="job-list" class="job-list"></ul>
    </section>

    <section class="panel overview-panel">
      <h2>Обзор</h2>
      <div id="overview" class="overview">
        <p class="muted">Выберите задание слева.</p>
      </div>
      <div class="tabs">
        <button class="tab active" data-tab="scenes">Сцены</button>
        <button class="tab" data-tab="log">Журнал</button>
      </div>
      <div id="tab-scenes" class="tab-panel">
        <div id="character-box" class="character-box" hidden>
          <label>Персонаж (применится при перегенерации кадров)
            <textarea id="character-input" rows="2"></textarea>
          </label>
          <button id="character-save" type="button">Сохранить персонажа</button>
        </div>
        <div id="scenes" class="scenes"></div>
      </div>
      <div id="tab-log" class="tab-panel" hidden>
        <pre id="log" class="log"></pre>
      </div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
